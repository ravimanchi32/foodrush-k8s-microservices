version: '3.8'

services:
  mysql-service:
    image: mysql:8.0
    container_name: foodrush-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food_delivery}
      MYSQL_USER: ${MYSQL_USER:-fooduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-foodpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-fooduser}", "-p${MYSQL_PASSWORD:-foodpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: foodrush-auth
    restart: always
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MYSQL_HOST: mysql-service
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-fooduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-foodpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food_delivery}
      JWT_SECRET: ${JWT_SECRET:-supersecretfooddeliveryjwtkey_change_in_production_2025}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "${AUTH_PORT:-8001}:8000"
    depends_on:
      mysql-service:
        condition: service_healthy

  backend-service:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: foodrush-backend
    restart: always
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MYSQL_HOST: mysql-service
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-fooduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-foodpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food_delivery}
      JWT_SECRET: ${JWT_SECRET:-supersecretfooddeliveryjwtkey_change_in_production_2025}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    depends_on:
      mysql-service:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: foodrush-frontend
    restart: always
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - auth-service
      - backend-service

volumes:
  mysql_data:
