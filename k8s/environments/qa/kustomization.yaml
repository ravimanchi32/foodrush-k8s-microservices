apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foodrush-qa

resources:
  - ../../

namePrefix: qa-

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-deployment
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend-deployment
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend-deployment
      spec:
        replicas: 2
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-service
      spec:
        ports:
          - port: 80
            targetPort: 80
            nodePort: 31080
            name: http

